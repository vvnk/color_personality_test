<!DOCTYPE html>

<html>
    <head>
        <title>Color Type Quiz!!</title>
    </head>

    <body>
        <!-- Get the results from localStorage and display -->
        <h1>Your results:</h1>
        <h1 id="result"></h1>
        <h4 id="desc"></h4>
        <p id="output"></p>

        <script>
            document.getElementById("result").innerText = localStorage.getItem("result");
            document.getElementById("desc").innerText = localStorage.getItem("desc");
            document.getElementById("output").innerText = localStorage.getItem("output");
        </script>

        <!-- Confetti time!! -->
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
        <script>
            function confetti() {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.67 } // hehe
                });
            }
        </script>
        <button onclick="confetti()">Yayay!!</button>
    </body>
</html>
