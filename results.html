<!DOCTYPE html>

<html>
    <head>
        <title>Color Type Quiz!!</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class = "center">
        <!-- Get the results from localStorage and display -->
        <h1>Your results:</h1>
        <h1 id="result"></h1>
        <h4 id="desc"></h4>
        <p id="output"></p>

        <script>
            document.getElementById("result").innerText = localStorage.getItem("result");
            document.getElementById("desc").innerText = localStorage.getItem("desc");
            document.getElementById("output").innerText = localStorage.getItem("output");
        </script>

        <!-- Confetti time!! -->
        <script type="module">
            import confetti from "https://cdn.skypack.dev/canvas-confetti";
            
            function boom() {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.67 } // hehe
                });
            }
        </script>
        <button onclick="confetti()">Yayay!!</button>
    </body>
</html>
