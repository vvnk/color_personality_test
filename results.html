<!DOCTYPE html>

<html>
    <head>
        <title>Color Type Quiz!!</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class = "center">
        <!-- Get the results from localStorage and display -->
        <h1>Your results:</h1>
        <h1 id="result"></h1>
        <h4 id="desc"></h4>
        
        <script>
            function runConfetti() {
                confetti({
                    particleCount: 100,
                    spread: 125,
                    origin: { y: 0.67 } //hehe
                });
            }
        </script>

        <button onclick="runConfetti()">Yayay!!</button>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
        <script>
            document.getElementById("result").innerText = localStorage.getItem("result");
            document.getElementById("desc").innerText = localStorage.getItem("desc");
        </script>
        <script>
            console.log(localStorage.getItem("result"));
            console.log(localStorage.getItem("desc"));
        </script>
    </body>
</html>
