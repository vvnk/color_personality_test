<!DOCTYPE html>

<html>
    <head>
        <title>Color Type Quiz!!</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class = "center">
        <!-- Get the results from localStorage and display -->
        <h1>Your results:</h1>
        <h1 id="result"></h1>
        <h4 id="desc"></h4>
        
        <script>
            function runConfetti() {
                let result = localStorage.getItem("result");
                let colors = [];    

                if (result.includes("Red")) {
                    colors = ["#DC143C", "#8B0000", "#FA8072", "#e60000"];
                }
                else if (result.includes("Yellow")) {
                    colors = ["#ffff00", "#DAA520", "#FFD700", "#FFDF00"];
                }
                else if (result.includes("Green")) {
                    colors = ["#006400", "#008000", "#32CD32", "#00e600"];
                }
                else if (result.includes("Blue")) {
                    colors = ["#0000ff", "#0000CD", "#000080", "#1E90FF"];
                }

                confetti({
                    particleCount: 100,
                    spread: 125,
                    origin: { y: 0.67 }, //hehe
                    colors: colors
                });
            }
        </script>

        <button onclick="runConfetti()">Yayay!!</button>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
        <script>
            document.getElementById("result").innerText = localStorage.getItem("result");
            document.getElementById("desc").innerText = localStorage.getItem("desc");
        </script>
        <script>
            console.log(localStorage.getItem("result"));
            console.log(localStorage.getItem("desc"));
        </script>
        <script>
            let results = localStorage.getItem("result");

            document.getElementById("result").innerText = results;
            document.getElementById("desc").innerText = localStorage.getItem("desc");

            if (results.includes("Red")) {
                document.getElementById("result").style.color = "red";
            }
            else if (results.includes("Yellow")) {
                document.getElementById("result").style.color = "gold";
            }
            else if (results.includes("Green")) {
                document.getElementById("result").style.color = "green";
            }
            else if (results.includes("Blue")) {
                document.getElementById("result").style.color = "blue";
            }
        </script>
    </body>
</html>
